<style>

#c{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#c.h{cursor:pointer}

table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}

/* evidence strength: segmented bar, deliberately unlike the circular risk gauge */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.seg.lb{margin-top:6px}.seg.lb span{font:500 9px 'JetBrains Mono';color:var(--mut);letter-spacing:.04em}.seg.lb span.cur{color:var(--txt);font-weight:700}
.callout{border:1px solid rgba(167,139,250,.45);background:rgba(167,139,250,.08);border-radius:12px;padding:12px 14px;margin:14px 0;line-height:1.55;font-size:13px}
.callout.amber{border-color:rgba(255,166,51,.5);background:rgba(255,166,51,.08)}

.fac .stl{font-size:10px;color:var(--mut);letter-spacing:.08em;margin-left:6px;font-style:normal}

.phs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<canvas id="c" aria-label="Interactive 3D scam detector. Click a node on the model to open it."></canvas>
<div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="#22e4d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2 4 7v8c0 8 5.5 13 12 15 6.5-2 12-7 12-15V7z"/><path d="m11 16 3.5 3.5L21 12"/></svg><div><b>VERTX-TEXT</b><small>TEXT SCAM FORENSICS</small></div></div>
<div class="hero"><h1>VERTX-TEXT</h1><h4>3D TEXT SCAM INDICATORS</h4><p>Paste a message to see risk indicators, how strong the evidence is, and where this method falls short.</p></div>
<div class="tag" id="tag"></div>
<nav class="sr" id="sr" aria-label="Model nodes"></nav>
<aside id="panel" aria-live="polite"><div class="ph"><h2 id="pt">PANEL</h2><button class="x" id="px" aria-label="Close panel">×</button></div><div class="pb" id="pb"></div></aside>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem={};const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]||d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
const COL={idle:'#22e4d4',scan:'#2fb8ff',safe:'#22e4d4',warn:'#ffa633',scam:'#ff4d5e',inc:'#9aa8c7'};
const TAG={idle:'CLICK A NODE · DRAG TO ROTATE',scan:'SCANNING MESSAGE…',safe:'SCENE STATE · FEW INDICATORS',warn:'SCENE STATE · MIXED INDICATORS',scam:'SCENE STATE · MANY INDICATORS',inc:'SCENE STATE · INCONCLUSIVE'};
let state='idle',cur=null,openId=null,sel=-1,hover=-1,busy=false;
function setState(s){state=s;document.documentElement.style.setProperty('--st',COL[s]);$('#tag').textContent=TAG[s]}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- detection engine ----------
   Everything below is RULE-BASED (fixed regex phrase matching) plus HEURISTIC
   (hand-set weights, thresholds and an evidence-quality check).
   No AI model is used and no accuracy has been measured, so no accuracy or
   percentage confidence is ever shown. */
const CATS={urg:['Urgency and pressure','#ffa633'],lure:['Money or prize lure','#c084fc'],cred:['Credential theft','#ff4d5e'],imp:['Impersonation','#2fb8ff'],thr:['Threats','#ff7a45'],link:['Suspicious links','#f472b6'],pay:['Unusual payment demand','#facc15']};
const RULES=[
['urg',/\b(urgent(ly)?|immediately|right now|act now|within \d+ (hours?|minutes?)|last (chance|warning)|expires? (today|soon)|final notice|asap|limited time|do not (tell|share)|keep (this )?(secret|confidential)|don['’]t tell anyone)\b/gi,22],
['lure',/\b(you['’]?ve won|winner|lottery|prize|jackpot|claim your|free gift|cash ?back|guaranteed (returns?|profit)|double your|investment opportunity|crypto|bitcoin|passive income|\d+% returns?|congratulations)\b/gi,26],
['cred',/\b(otp|one[- ]time (password|code)|password|cvv|verify your (account|identity|kyc)|confirm your (details|account)|kyc|aadhaar|ssn|social security|card number|bank details|\bpin\b)\b/gi,30],
['imp',/\b(bank|paypal|amazon|netflix|irs|income tax|customs|fedex|dhl|india post|police|microsoft support|apple support|sbi|hdfc|icici|official)\b/gi,12],
['thr',/\b(suspended|blocked|locked|legal action|arrest|warrant|penalty|deactivated|unauthori[sz]ed (login|transaction|activity)|account (will be )?(closed|terminated))\b/gi,24],
['link',/(https?:\/\/\S+|www\.\S+|\b(bit\.ly|tinyurl\.com|cutt\.ly|goo\.gl)\/\S*)/gi,22],
['pay',/\b(gift ?cards?|wire transfer|western union|moneygram|processing fee|advance fee|registration fee|send (money|payment)|pay (a )?(small )?fee)\b/gi,32]];
const WHY={urg:'Scammers rush you so you do not stop to think or check.',lure:'Unexpected rewards or easy profits are bait for fees or personal data.',cred:'Real companies never ask for OTPs, PINs or passwords by message.',imp:'Fraudsters borrow trusted names. Contact the company using its official app or number.',thr:'Fear of losing access or being penalised is used to force quick action.',link:'Links in unsolicited messages often lead to fake login pages.',pay:'Gift cards, wires and “fees” are hard to reverse and favoured by scammers.'};
const ALT={urg:'Genuine deadlines exist. Bills, delivery slots, real security alerts and sales all use time pressure.',lure:'Legitimate promotions, loyalty rewards and real contests use words like “prize” and “winner”.',cred:'A genuine service may mention OTPs or KYC, often to warn you never to share them. Context decides.',imp:'Real organisations message under their own names. A name match alone proves nothing.',thr:'Real accounts do get locked or flagged, and genuine notices say so.',link:'Many real services send links, including shortened ones from marketing tools.',pay:'Real invoices and fees exist. Who asked, and how they want to be paid, is what matters.'};
const LATIN=/\p{Script=Latin}/u;
function analyze(text){
  const hits=[],cs={},ph={};
  for(const [k,re,w] of RULES){let n=0,m;const seen=[];re.lastIndex=0;
    while((m=re.exec(text))){hits.push({s:m.index,e:m.index+m[0].length,k});n++;
      if(m[0].length===0){re.lastIndex++;continue}
      const p=m[0].trim().slice(0,48);if(!seen.some(x=>x.toLowerCase()===p.toLowerCase()))seen.push(p)}
    if(n){cs[k]=Math.min(100,Math.round(w*(1+.35*(n-1))*(k==='imp'?1:1.4)));ph[k]={n,list:seen.slice(0,6)}}}
  const caps=(text.match(/\b[A-Z]{4,}\b/g)||[]).length,ex=(text.match(/!{2,}/g)||[]).length;let fmt=null;
  if(caps>=2||ex){const add=10+ex*5;cs.urg=Math.min(100,(cs.urg||0)+add);fmt={caps,ex,add}}
  /* risk score: strongest category counts in full, every other category adds 40% of its strength */
  const ent=Object.entries(cs).sort((a,b)=>b[1]-a[1]),contrib={},notes=[];let raw=0;
  ent.forEach(([k,v],i)=>{const c=i?v*.4:v;contrib[k]=Math.round(c);raw+=c});
  let risk=Math.min(100,Math.round(raw));
  if(raw>100)notes.push('The raw total was above 100 and was capped at 100.');
  if(cs.imp&&ent.length===1&&risk>20){risk=20;contrib.imp=20;notes.push('Organisation names on their own are weak evidence, so the score is capped at 20.')}
  const rl=risk>=60?'high':risk>=25?'medium':'low';
  /* evidence assessment: how much usable evidence did the analysis have? */
  const words=text.trim().split(/\s+/).length,letters=text.match(/\p{L}/gu)||[],nonLat=letters.length?letters.filter(c=>!LATIN.test(c)).length/letters.length:0,ncat=ent.length;
  const F=[];
  F.push(words<8?{k:'len',st:'poor',t:'Message length',n:`Only ${words} word${words===1?'':'s'}. Too little text for rules to find a meaningful pattern.`}
    :words<25?{k:'len',st:'limited',t:'Message length',n:`${words} words. Short messages give the rules little context.`}
    :{k:'len',st:'good',t:'Message length',n:`${words} words. Enough text to look for several patterns.`});
  F.push(nonLat>.5?{k:'lang',st:'poor',t:'Language coverage',n:'Most of the text is not in Latin script. The rules only know English keywords, so a clean result here means nothing.'}
    :nonLat>.15?{k:'lang',st:'limited',t:'Language coverage',n:'Part of the text is not in Latin script and cannot be read by the rules.'}
    :{k:'lang',st:'good',t:'Language coverage',n:'Mostly Latin script. Note the rules still only match English words; Romanised Hindi and other languages are not covered.'});
  F.push(ncat===0?{k:'corr',st:'limited',t:'Corroboration between indicators',n:'No indicator category matched. Having no matches is weak evidence: a scam can avoid these keywords.'}
    :ncat===1?{k:'corr',st:'limited',t:'Corroboration between indicators',n:'Only one category matched. A single signal is easy to explain innocently.'}
    :{k:'corr',st:'good',t:'Corroboration between indicators',n:`${ncat} separate categories matched. Agreement between categories makes a coincidence less likely, though they are not fully independent.`});
  if(cs.link)F.push({k:'verify',st:'limited',t:'Link verification',n:'A link is present, but only its text pattern was checked. Its destination was not opened, resolved or compared with any reputation source.'});
  const poorBlock=F.some(f=>f.st==='poor'&&(f.k==='len'||f.k==='lang'));
  const pts=F.reduce((a,f)=>a+(f.st==='good'?2:f.st==='limited'?1:0),0),ratio=pts/(2*F.length);
  /* the top band ("high") is intentionally unreachable: this rule set has no validation data behind it */
  const band=poorBlock?'insufficient':(ratio>=.75&&ncat>=2?'moderate':'low');
  const lvl=band==='insufficient'?'inc':rl==='high'?'scam':rl==='medium'?'warn':'safe';
  hits.sort((a,b)=>a.s-b.s||b.e-a.e);const clean=[];let end=-1;for(const h of hits)if(h.s>=end){clean.push(h);end=h.e}
  return{risk,rl,cs,ph,fmt,contrib,notes,hits:clean,lvl,band,F,ncat,text,words,id:'SS-'+Math.random().toString(16).slice(2,8).toUpperCase(),t:Date.now()}}

const BANDS={
insufficient:{l:'INSUFFICIENT',c:'#8aa0b2',i:0,d:'There was not enough readable text for these rules to assess. Treat any result as inconclusive.'},
low:{l:'LOW',c:'#7c9cff',i:1,d:'Some usable evidence, but it is thin or uncorroborated. Treat the result as a weak lead only.'},
moderate:{l:'MODERATE',c:'#a78bfa',i:2,d:'Enough text, and several separate indicators agree. It is still unverified: nothing was checked against the sender, the link destination or any external source.'}};
const RCOL={high:COL.scam,medium:COL.warn,low:COL.safe};
const VERD={
scam:['MANY SCAM INDICATORS','HIGH',['Do not click links or reply until you have verified the sender.','Never share OTPs, PINs or passwords.','Contact the organisation through its official app or a number you already trust.','If it still looks wrong, block the sender and report the message.']],
warn:['SOME INDICATORS','MEDIUM',['Verify the sender before acting.','Do not open links until you confirm they are genuine.','Ask someone you trust for a second opinion.']],
safe:['FEW OR NO INDICATORS','LOW',['No strong indicators matched. That does not confirm the message is genuine.','Stay alert and verify anything that asks for money or personal data.']],
inc:['INCONCLUSIVE','UNKNOWN',['This analysis cannot say either way. Do not treat it as safe.','If anything is being asked of you, verify through an official channel.','Paste the full message in English text for a fuller check.']]};
const SHORT={scam:'HIGH SCORE',warn:'MEDIUM SCORE',safe:'LOW SCORE',inc:'INCONCLUSIVE'};
const READ=a=>{
  if(a.lvl==='inc')return 'The text is too short, or in a form these rules cannot read, so no conclusion can be drawn. '+(a.ncat?'Some indicators did match, so be cautious and verify the message independently.':'Having no matches here is not evidence of safety.');
  if(a.rl==='high')return a.band==='moderate'?'Several separate scam indicators matched and the text was long enough to assess. This is a strong lead, but it is still not proof.':'The risk score is high, but the supporting evidence is limited. Verify the message independently before relying on this result.';
  if(a.rl==='medium')return 'Some indicators matched. The evidence is mixed and does not support a firm conclusion either way.';
  return 'Few or no indicators matched. That does not show the message is genuine: scams can avoid these keywords, and the rules cannot see the sender, a link’s destination or other languages.'};
const DEMOS={bank:'URGENT: Your SBI account has been suspended due to unauthorized login. Verify your KYC immediately at http://sbi-secure-login.bit.ly/verify or your account will be blocked within 24 hours. Share the OTP you receive.',prize:'Congratulations!!! You’ve won a $5,000 Amazon gift card. Claim your prize now: bit.ly/claim-win-now. A small processing fee is required. Do not tell anyone.',safe:'Hi Priya, the design review is moved to 3 pm tomorrow. I’ve updated the calendar invite. Let me know if that clashes with anything.',short:'Urgent, send the fee now!!'};
const hist=()=>store.get('ss_hist',[]);

/* ---------- module registry: what each TruthLens-style module can honestly claim ---------- */
const MODS=[
{m:'Text',on:true,meth:'Rule-based phrase matching plus heuristic scoring. No AI model.',lim:'English keywords only; no sender, header or link-destination checks; hand-set weights; accuracy never measured.'},
{m:'Image',on:false,meth:'No analyzer is connected in this build.',lim:'When one is connected, expect limits such as: re-compression, screenshots and resizing destroy forensic traces, and detectors can fail on generators they were not trained on.'},
{m:'Video',on:false,meth:'No analyzer is connected in this build.',lim:'When one is connected, expect limits such as: low resolution and heavy compression hide artefacts, and results can differ between frames and between detectors.'},
{m:'Audio',on:false,meth:'No analyzer is connected in this build.',lim:'When one is connected, expect limits such as: phone codecs, background noise and very short clips reduce reliability, and voice-similarity is not identity.'}];

/* ---------- nodes ---------- */
const lockF=()=>!cur;
const NODES=[
{id:'scan',label:'SCAN',sub:()=>'PASTE TEXT',lock:()=>false},
{id:'score',label:'RISK SCORE',sub:()=>cur?cur.risk+' / 100':'LOCKED',lock:lockF},

const SPLIT=6;
NODES.forEach((n,i)=>{const ring=i<SPLIT?0:1,k=ring?i-SPLIT:i,cnt=ring?NODES.length-SPLIT:SPLIT;n.ring=ring;n.a=k/cnt*6.2832+(ring?.5:0)+.3;n.y=ring?.82:-.82});

/* ---------- 3D canvas ---------- */
const C=$('#c'),X=C.getContext('2d');let W,H,R,yaw=.6,pitch=.2,vy=0,drag=false,moved=0,lx=0,ly=0,cx=0,cy=0,lvl=0,scanT=0,hits=[],time=0;
function fit(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*d;C.height=H*d;X.setTransform(d,0,0,d,0,0);R=Math.min(W*.13,H*.19);if(!cx){cx=W/2;cy=H/2}}
addEventListener('resize',fit);fit();
function proj(x,y,z){const c=Math.cos(yaw),s=Math.sin(yaw),x1=x*c+z*s,z1=-x*s+z*c,cp=Math.cos(pitch),sp=Math.sin(pitch),y1=y*cp-z1*sp,z2=y*sp+z1*cp,k=5.5/(5.5+z2);return[cx+x1*R*k,cy+y1*R*k,z2,k]}
const sparks=Array.from({length:260},()=>{const z=1-2*Math.random(),a=Math.random()*6.2832,q=Math.sqrt(1-z*z);return{x:q*Math.cos(a),y:z,z:q*Math.sin(a),o:1.1+Math.random()*.5}});
const hexA=(h,a)=>h+Math.round(clamp(a,0,1)*255).toString(16).padStart(2,'0');
function frame(t){time=t/1000;const mob=W<760,open=!!openId;
  cx+=((open&&!mob?W*.3:W/2)-cx)*.08;cy+=((open&&mob?H*.25:H*.5)-cy)*.08;
  if(!drag){if(sel>=0){const tg=NODES[sel].a+Math.PI/2,d=((tg-yaw)%6.2832+9.4248)%6.2832-3.1416;yaw+=d*.08;pitch+=(.12-pitch)*.06}else{yaw+=.0024+vy;vy*=.95}}
  lvl+=((state==='scan'?.9:state==='scam'?.5:.15)-lvl)*.05;if(state==='scan')scanT+=.02;
  const col=COL[state];X.clearRect(0,0,W,H);
  const g=X.createRadialGradient(cx,cy,0,cx,cy,R*1.6);g.addColorStop(0,hexA(col,.22));g.addColorStop(1,hexA(col,0));X.fillStyle=g;X.beginPath();X.arc(cx,cy,R*1.6,0,6.2832);X.fill();
  const items=NODES.map((n,i)=>({n,i,p:proj(Math.cos(n.a)*2.6,n.y+Math.sin(time*.8+n.a*3)*.05,Math.sin(n.a)*2.6)}));
  X.lineWidth=1;X.setLineDash([3,6]);items.forEach(it=>{X.strokeStyle=hexA(col,sel===it.i||hover===it.i?.5:.13);X.beginPath();X.moveTo(cx,cy);X.lineTo(it.p[0],it.p[1]);X.stroke()});X.setLineDash([]);
  const far=items.filter(i=>i.p[2]>0).sort((a,b)=>b.p[2]-a.p[2]),near=items.filter(i=>i.p[2]<=0).sort((a,b)=>b.p[2]-a.p[2]);hits=[];
  far.forEach(drawNode);
  const jit=state==='scam'&&Math.random()<.12?.07:0;
  for(let i=1;i<=14;i++){const lat=(i/15-.5)*Math.PI,r0=Math.cos(lat),y0=Math.sin(lat),glow=state==='scan'?Math.exp(-Math.pow(((scanT%1.5)/1.5)*2-1-y0,2)*40):0;let pv=null;
    for(let s=0;s<=48;s++){const a=s/48*6.2832,rad=1+.04*Math.sin(a*5+time*3+lat*4)+lvl*.09*Math.sin(a*3-time*4)+(jit?(Math.random()-.5)*jit:0),p=proj(r0*Math.cos(a)*rad,y0*rad,r0*Math.sin(a)*rad);
      if(pv){X.strokeStyle=hexA(col,clamp(.45-p[2]*.18+glow*.6,.05,.95));X.lineWidth=1+glow*1.5;X.beginPath();X.moveTo(pv[0],pv[1]);X.lineTo(p[0],p[1]);X.stroke()}pv=p}}
  for(let m=0;m<10;m++){const a=m/10*6.2832;let pv=null;for(let i=0;i<=30;i++){const lat=(i/30-.5)*Math.PI,r0=Math.cos(lat),p=proj(r0*Math.cos(a),Math.sin(lat),r0*Math.sin(a));if(pv){X.strokeStyle=hexA(col,clamp(.32-p[2]*.15,.04,.6));X.lineWidth=1;X.beginPath();X.moveTo(pv[0],pv[1]);X.lineTo(p[0],p[1]);X.stroke()}pv=p}}
  for(const s of sparks){const w=1+lvl*.25,p=proj(s.x*s.o*w,s.y*s.o*w,s.z*s.o*w);X.fillStyle=hexA(col,clamp(.7-p[2]*.25,.1,1));X.fillRect(p[0],p[1],1.6,1.6)}
  near.forEach(drawNode);requestAnimationFrame(frame)}
function drawNode(it){const{n,i,p}=it,k=p[3],w=Math.max(112,R*1.12)*k,h=44*k,x=p[0]-w/2,y=p[1]-h/2,on=sel===i||hover===i,lk=n.lock(),col=COL[state],al=(lk?.45:1)*clamp(1-p[2]*.1,.35,1)*(sel>=0&&sel!==i?.5:1);
  X.globalAlpha=al;X.fillStyle='rgba(8,18,34,.88)';X.strokeStyle=hexA(col,on?1:.5);X.lineWidth=on?2:1;X.shadowColor=col;X.shadowBlur=on?18:6;X.beginPath();X.roundRect(x,y,w,h,10*k);X.fill();X.stroke();X.shadowBlur=0;
  X.fillStyle=col;X.font=`500 ${9*k}px 'JetBrains Mono',monospace`;X.textAlign='left';X.fillText((lk?'🔒 ':'')+n.label,x+9*k,y+17*k);
  X.fillStyle='#8aa0b2';X.font=`400 ${9*k}px 'JetBrains Mono',monospace`;X.fillText(n.sub(),x+9*k,y+33*k);X.globalAlpha=1;hits.push({i,x,y,w,h,z:p[2]})}
const hitAt=(x,y)=>{let b=-1,bz=1e9;for(const h of hits)if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h&&h.z<bz){bz=h.z;b=h.i}return b};
C.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;C.setPointerCapture(e.pointerId)});
C.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);if(moved>8){if(sel>=0)sel=-1;yaw+=dx*.0035;pitch=clamp(pitch+dy*.0035,-1,1);vy=dx*.0004}lx=e.clientX;ly=e.clientY}else{hover=hitAt(e.clientX,e.clientY);C.classList.toggle('h',hover>=0)}});
C.addEventListener('pointerup',e=>{drag=false;if(moved<8){const i=hitAt(e.clientX,e.clientY);if(i>=0)clickNode(i);else if(openId)closePanel()}});

flags:grow,
verdict(){$('#again').onclick=()=>openPanel('scan');$('#lim').onclick=()=>openPanel('limits');$('#cp').onclick=()=>{
  const r=['VERTX-TEXT '+cur.id,'Result: '+VERD[cur.lvl][0],'Risk score: '+cur.risk+'/100 (heuristic, not a probability)','Evidence strength: '+BANDS[cur.band].l+' (qualitative, not accuracy)','Methods: rule-based matching and heuristic scoring; no AI model used','Indicators: '+(Object.keys(cur.cs).map(k=>CATS[k][0]).join(', ')||'none matched'),'Limits: English keyword rules only; sender and link destination not verified.','Automated indicators are leads, not proof.'].join('\n');
  try{navigator.clipboard.writeText(r).then(()=>toast('Report copied'),()=>toast('Could not copy automatically'))}catch(e){toast('Could not copy automatically')}}},
history(){const b=$('#ch');if(b)b.onclick=()=>{store.set('ss_hist',[]);openPanel('history')}}};
function run(){if(busy)return;const text=$('#tx').value.trim();if(text.length<8){toast('Paste at least a short sentence to scan');return}
  busy=true;setState('scan');$('#prog').classList.add('on');const steps=['Reading text…','Checking language coverage…','Matching scam phrases…','Inspecting link patterns…','Scoring risk…','Assessing evidence strength…'];let i=0;
  const tick=setInterval(()=>{if(i<steps.length){$('#pl').textContent=steps[i];const pc=Math.round((i+1)/steps.length*100);$('#pp').textContent=pc+'%';$('#pi').style.width=pc+'%';i++;return}
    clearInterval(tick);busy=false;cur=analyze(text);setState(cur.lvl);const h=hist();h.unshift({s:text.slice(0,38),risk:cur.risk,lvl:cur.lvl,band:cur.band});store.set('ss_hist',h.slice(0,10));openPanel('score')},330)}
setState('idle');requestAnimationFrame(frame);
</script>
</body>
