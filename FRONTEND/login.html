<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VERTX - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--cyan:#22e6ff;--blue:#3b7bff;--text:#e6f2ff;--mute:#8aa3c4;--line:rgba(34,230,255,.28)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,#0b2358 0,transparent 55%),linear-gradient(135deg,#02040b,#06112a);font-family:Inter,system-ui,sans-serif;color:var(--text)}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(34,230,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,230,255,.05) 1px,transparent 1px);background-size:48px 48px}
    .login{position:relative;width:min(420px,calc(100% - 32px));padding:38px;border:1px solid var(--line);border-radius:22px;background:rgba(8,19,43,.82);box-shadow:0 24px 80px rgba(0,0,0,.55),0 0 40px rgba(34,230,255,.08);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:12px;font-family:Orbitron,sans-serif;font-size:24px;letter-spacing:.12em;margin-bottom:28px}.brand b{color:var(--cyan)}
    .brand svg{width:38px;filter:drop-shadow(0 0 8px var(--cyan))}
    h1{font-family:Orbitron,sans-serif;font-size:25px;margin:0 0 8px}.sub{color:var(--mute);margin:0 0 26px;font-size:14px}
    label{display:block;margin:16px 0 7px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    input{width:100%;height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(2,8,22,.78);color:var(--text);outline:none;font-size:15px}
    input:focus{border-color:var(--cyan);box-shadow:0 0 18px rgba(34,230,255,.18)}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 22px;font-size:13px;color:var(--mute)}.row label{display:flex;align-items:center;gap:8px;margin:0;text-transform:none;cursor:pointer}.row input{width:auto;height:auto;accent-color:var(--cyan)}
    button{width:100%;height:50px;border:0;border-radius:10px;background:linear-gradient(135deg,#0ac7e6,#2f6bff);color:#02101f;font:700 13px Orbitron,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 24px rgba(34,230,255,.28)}
    button:hover{filter:brightness(1.08)}.msg{min-height:20px;margin-top:14px;color:#ffb86b;font-size:13px;text-align:center}
    .demo{margin-top:18px;padding-top:16px;border-top:1px solid rgba(34,230,255,.12);color:var(--mute);font-size:12px;text-align:center}.demo code{color:var(--cyan)}
  </style>
</head>
<body>
  <main class="login">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="#22e6ff" stroke-width="1.8"><path d="M16 2l11 4v8c0 7-5 12-11 16C10 26 5 21 5 14V6z"/><ellipse cx="16" cy="15" rx="6" ry="3.6"/><circle cx="16" cy="15" r="1.6" fill="#22e6ff"/></svg>
      VERT<b>X</b>
    </div>
    <h1>Secure Access</h1>
    <p class="sub">Sign in to open the forensic workspace.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="anyname@gmail.com" pattern=".+@gmail\.com" title="Enter a Gmail address" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Example: mypass@123" pattern=".+@123" title="Password must end with @123" required>
      <div class="row">
        <label><input id="remember" type="checkbox" checked> Remember this browser</label>
      </div>
      <button type="submit">Sign In</button>
      <div class="msg" id="message" role="status"></div>
    </form>
    <div class="demo">Example: <code>yourname@gmail.com</code> / <code>anything@123</code></div>
  </main>
  <script>
    const form=document.getElementById('loginForm');

    form.addEventListener('submit',event=>{
      event.preventDefault();
      const email=document.getElementById('email').value.trim().toLowerCase();
      const password=document.getElementById('password').value;
      const remember=document.getElementById('remember').checked;
      document.getElementById('message').textContent='Signing in…';
      fetch('/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email,password,remember})
      }).then(async response=>{
        const data=await response.json().catch(()=>({}));
        if(response.ok){
          location.replace('/');
        }else{
          document.getElementById('message').textContent=data.error||'Invalid email or password.';
        }
      }).catch(()=>{
        document.getElementById('message').textContent='The server is unavailable.';
      });
    });

  </script>
</body>
</html>
