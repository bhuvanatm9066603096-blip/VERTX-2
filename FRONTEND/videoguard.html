const VR={fake:['LIKELY AI-GENERATED OR MANIPULATED','HIGH',['Do not treat this video as proof of a real event.','Find the original source and the first upload date.','Check news sources and fact-checkers for the same clip.','Ask the sender how and where it was recorded.']],warn:['UNCERTAIN','MEDIUM',['Signals are mixed, so verify the source before sharing.','Try the original, higher-quality file if one exists.','Look for the same clip from other accounts.']],safe:['LIKELY AUTHENTIC','LOW',['No strong signs of AI generation were found.','Stay alert: no detector is perfect, and careful edits can pass.']]};

const V={
upload:()=>`<div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a video"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#22e4d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg><h5>Drop a video here</h5><small>or click to browse · MP4, WEBM, MOV · up to 200 MB</small></div><input type="file" id="file" accept="video/*" hidden>
<div class="row"><small style="color:var(--mut)">No video handy? Try a generated sample:</small><button class="btn g sm" data-d="real">Natural-style</button><button class="btn g sm" data-d="ai">Glitchy-style</button></div>
<div class="prog" id="prog"><div class="mono" style="display:flex;justify-content:space-between;font-size:12px"><span id="pl">Starting…</span><span id="pp">0%</span></div><div class="pbar"><i id="pi"></i></div></div>
<p class="hint">Analysis runs in your browser. VERTX-VIDEO samples frames across the clip and measures sensor noise, sharpness, lighting stability and metadata. Your video is never uploaded. Scoring is a heuristic demo and can be wrong, so treat it as a hint, not proof.</p>`,
score:()=>{const c=COL[cur.lv],ci=552.9;return`<div class="gauge"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/><circle id="rv" cx="100" cy="100" r="88" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${ci}" stroke-dashoffset="${ci}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px ${c})"/></svg><div class="mid"><small>DEEPFAKE RISK</small><b id="sn">0</b><small>/ 100</small></div></div><div class="pill" style="color:${c}">${VR[cur.lv][1]} RISK</div>

timeline:()=>`<small style="color:var(--mut);display:block;margin-bottom:8px">Authenticity over time (100 = looks natural)</small><canvas class="tl" id="tc"></canvas><div class="meta" style="margin-top:12px"><div><small>Frames sampled</small><b class="mono">${cur.fr.length}</b></div><div><small>Suspicious moments</small><b class="mono" style="color:${cur.flagged?'var(--amber)':'var(--cyan)'}">${cur.flagged}</b></div></div><p class="hint">Amber bands mark moments where sharpness, brightness or noise jumps away from the rest of the clip.</p>`,
frames:()=>`${cur.url?`<video id="pv" src="${cur.url}" controls muted playsinline></video>`:''}<div class="fg" id="fg"></div><p class="hint">Amber frames are flagged. ${cur.url?'Tap a frame to jump to that moment.':'Samples have no playable video.'}</p>`,
forensics:()=>Object.entries(cur.sub).map(([k,v])=>`<div class="bar"><span><b>${NAMES[k]}</b><em class="mono">${Math.round(v)}%</em></span><i><u data-w="${Math.round(v)}" style="background:${barC(v)}"></u></i></div>`).join('')+'<p class="hint">Bars show how natural each signal looks. Low values push the risk score up.</p>',

const W_={
upload(){const dr=$('#drop'),f=$('#file');dr.onclick=()=>f.click();dr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f.click()}};f.onchange=()=>f.files[0]&&fromFile(f.files[0]);

verdict(){$('#again').onclick=()=>openPanel('upload');$('#cp').onclick=()=>{const r=`VERTX-VIDEO ${cur.id}: ${VR[cur.lv][0]}, risk ${cur.risk}/100, confidence ${cur.conf}%`;try{navigator.clipboard.writeText(r).then(()=>toast('Report copied'),()=>toast(r))}catch(e){toast(r)}}},

async function fromFile(f){if(!f.type.startsWith('video/')){toast('Please choose a video file');return}if(f.size>200*1048576){toast('That file is over 200 MB');return}
